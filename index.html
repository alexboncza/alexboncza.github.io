<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alex Boncza — About</title>
    <style>
      /* @import url("https://fonts.bunny.net/css?family=space-grotesk:300,400,500,600,700&display=swap"); */

      :root {
        color-scheme: dark;
        --bg-deep: #050712;
        --bg-alt: #0e1021;
        --bauhaus-red: #ff3355;
        --bauhaus-blue: #3a86ff;
        --bauhaus-yellow: #ffbe0b;
        --bauhaus-teal: #2ec4b6;
        --bauhaus-orange: #ff6f3c;
        --bauhaus-pink: #ff006e;
        --text-main: #f8f9ff;
        --text-muted: #b4b7d9;
        /* --font-main: "Space Grotesk", sans-serif; */
        --font-main: "Hanken Grotesk", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

        /* Trying to improve font quality */
        text-shadow: rgba(0, 0, 0, 0.01) 0 0 1px;
        font-smooth: always;
        -webkit-font-smoothing: subpixel-antialiased;
        -moz-osx-font-smoothing: grayscale;
        -o-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        font-family: var(--font-main);
      }

      html,
      body {
        min-height: 100%;
        width: 100%;
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        display: flex;
        background: radial-gradient(
          circle at top left,
          #1a1d3a 0%,
          var(--bg-deep) 40%,
          #050509 100%
        );
        overflow-x: hidden;
        position: relative;
        color: var(--text-main);
        padding-top: 0.5rem;
        padding-bottom: 25px;
      }

      .bg-container {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }

      .bg-layer {
        position: absolute;
        inset: -10%;
        background:
          radial-gradient(
            circle at 10% 20%,
            rgba(255, 190, 11, 0.18) 0,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 15%,
            rgba(58, 134, 255, 0.18) 0,
            transparent 55%
          ),
          radial-gradient(
            circle at 20% 85%,
            rgba(255, 0, 110, 0.22) 0,
            transparent 50%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(46, 196, 182, 0.2) 0,
            transparent 55%
          );
        mix-blend-mode: screen;
        opacity: 0.9;
      }

      .bg-shape {
        position: absolute;
      }

      .circle-1 {
        width: 420px;
        height: 420px;
        background: conic-gradient(
          from 140deg,
          var(--bauhaus-red),
          var(--bauhaus-yellow),
          var(--bauhaus-teal),
          var(--bauhaus-blue),
          var(--bauhaus-red)
        );
        border-radius: 50%;
        top: -140px;
        left: -120px;
        filter: blur(1px);
        opacity: 0.55;
      }

      .circle-2 {
        width: 320px;
        height: 320px;
        background: radial-gradient(
          circle,
          var(--bauhaus-pink),
          var(--bauhaus-blue)
        );
        border-radius: 50%;
        bottom: -120px;
        right: -100px;
        opacity: 0.45;
        filter: blur(0.5px);
      }

      .triangle-1 {
        width: 0;
        height: 0;
        border-left: 180px solid transparent;
        border-right: 180px solid transparent;
        border-bottom: 300px solid var(--bauhaus-yellow);
        top: 5%;
        right: 2%;
        opacity: 0.25;
        transform: rotate(18deg);
        mix-blend-mode: screen;
      }

      .triangle-2 {
        width: 0;
        height: 0;
        border-left: 130px solid transparent;
        border-right: 130px solid transparent;
        border-bottom: 230px solid var(--bauhaus-teal);
        bottom: 10%;
        left: 0%;
        opacity: 0.26;
        transform: rotate(-14deg);
        mix-blend-mode: screen;
      }

      .rectangle-1 {
        width: 140px;
        height: 260px;
        background: var(--bauhaus-orange);
        top: 18%;
        left: 10%;
        opacity: 0.3;
        transform: rotate(18deg);
        mix-blend-mode: screen;
      }

      .rectangle-2 {
        width: 110px;
        height: 220px;
        background: var(--bauhaus-blue);
        bottom: 18%;
        right: 14%;
        opacity: 0.3;
        transform: rotate(-22deg);
        mix-blend-mode: screen;
      }

      .line-1 {
        width: 360px;
        height: 10px;
        background: linear-gradient(
          90deg,
          var(--bauhaus-red),
          var(--bauhaus-yellow)
        );
        top: 12%;
        right: 20%;
        opacity: 0.7;
        transform: rotate(40deg);
      }

      .line-2 {
        width: 280px;
        height: 8px;
        background: linear-gradient(
          90deg,
          var(--bauhaus-teal),
          var(--bauhaus-blue)
        );
        bottom: 8%;
        left: 18%;
        opacity: 0.7;
        transform: rotate(-32deg);
      }

      .square-1 {
        width: 110px;
        height: 110px;
        background: var(--bauhaus-pink);
        top: 60%;
        right: 6%;
        opacity: 0.35;
        transform: rotate(35deg);
      }

      .arc-1 {
        width: 220px;
        height: 220px;
        border: 18px solid var(--bauhaus-yellow);
        border-radius: 50%;
        border-top-color: transparent;
        border-right-color: transparent;
        top: 4%;
        left: 16%;
        opacity: 0.4;
        transform: rotate(-35deg);
      }

      .card-wrapper {
        position: relative;
        z-index: 5;
        width: 100%;
        max-width: 560px;
        padding: 1.25rem;
        margin: auto;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
      }

      .card {
        position: relative;
        background: radial-gradient(
          circle at top left,
          #31355d 0%,
          #15172c 38%,
          #090a18 100%
        );
        padding: clamp(1.75rem, 4vw + 1rem, 3.25rem)
          clamp(1.25rem, 3vw + 1rem, 3rem) clamp(1.5rem, 3vw + 1rem, 3rem);
        border-radius: 22px;
        box-shadow:
          0 26px 80px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(255, 255, 255, 0.06);
        width: 100%;
        max-width: 520px;
        box-sizing: border-box;
        text-align: center;
        overflow: hidden;
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -20%;
        width: 140%;
        height: 6px;
        background: linear-gradient(
          90deg,
          var(--bauhaus-red) 0%,
          var(--bauhaus-yellow) 18%,
          var(--bauhaus-teal) 36%,
          var(--bauhaus-blue) 54%,
          var(--bauhaus-orange) 72%,
          var(--bauhaus-pink) 90%
        );
      }

      .card::after {
        content: "";
        position: absolute;
        bottom: -40px;
        right: -40px;
        width: 140px;
        height: 140px;
        background: conic-gradient(
          from 210deg,
          var(--bauhaus-yellow),
          var(--bauhaus-orange),
          var(--bauhaus-red)
        );
        border-radius: 50%;
        opacity: 0.25;
        filter: blur(2px);
      }

      .card-decoration {
        position: absolute;
        z-index: -1;
      }

      .card-circle {
        width: 90px;
        height: 90px;
        background: var(--bauhaus-teal);
        border-radius: 50%;
        bottom: -30px;
        left: -20px;
        opacity: 0.35;
      }

      .card-triangle {
        width: 0;
        height: 0;
        border-left: 48px solid transparent;
        border-right: 48px solid transparent;
        border-bottom: 82px solid var(--bauhaus-pink);
        top: -32px;
        right: -18px;
        opacity: 0.4;
        transform: rotate(12deg);
      }

      .card-stripe {
        position: absolute;
        inset: 50% auto auto -8%;
        width: 120%;
        height: 90px;
        background: linear-gradient(
          120deg,
          rgba(255, 0, 110, 0.09),
          rgba(255, 190, 11, 0.16),
          rgba(58, 134, 255, 0.2),
          rgba(46, 196, 182, 0.18)
        );
        transform: skewY(-10deg);
        opacity: 0.9;
        pointer-events: none;
      }

      .profile-section {
        margin-bottom: 2.2rem;
        position: relative;
        z-index: 2;
      }

      .avatar {
        width: clamp(76px, 18vw, 104px);
        height: clamp(76px, 18vw, 104px);
        background: conic-gradient(
          from 210deg,
          var(--bauhaus-blue),
          var(--bauhaus-teal),
          var(--bauhaus-yellow),
          var(--bauhaus-orange),
          var(--bauhaus-pink),
          var(--bauhaus-blue)
        );
        border-radius: 50%;
        margin: 0 auto 1.65rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        color: var(--text-main);
        font-weight: 700;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.85);
        position: relative;
      }

      .avatar::before {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 20%,
          #ffffff22 0,
          #000000 70%
        );
      }

      .avatar::after {
        content: "";
        position: absolute;
        width: 120%;
        height: 120%;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.55);
        mix-blend-mode: screen;
        opacity: 0.7;
      }

      h1 {
        font-size: clamp(1.5rem, 4vw + 0.8rem, 2.1rem);
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 0.5rem;
        /* letter-spacing: -0.03em; */
      }

      .subtitle {
        font-size: clamp(0.85rem, 1.6vw + 0.6rem, 1.05rem);
        color: var(--bauhaus-yellow);
        font-weight: 500;
        margin-bottom: 1.2rem;
        /* letter-spacing: 0.08em; */
        text-transform: uppercase;
      }

      .description {
        font-size: clamp(0.85rem, 1vw + 0.7rem, 0.98rem);
        color: var(--text-muted);
        line-height: 1.7;
        margin-bottom: 2.3rem;
        max-width: 420px;
        margin-left: auto;
        margin-right: auto;
      }

      .description span {
        color: var(--bauhaus-teal);
      }

      .cta-row {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: center;
      }

      .cta-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(
          135deg,
          var(--bauhaus-pink),
          var(--bauhaus-orange),
          var(--bauhaus-yellow)
        );
        color: #05050b;
        padding: clamp(0.85rem, 2vw + 0.5rem, 1.1rem)
          clamp(1.5rem, 5vw + 0.5rem, 2.7rem);
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.98rem;
        /* letter-spacing: 0.08em; */
        text-transform: uppercase;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow:
          0 16px 45px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(0, 0, 0, 0.7);
        position: relative;
        overflow: hidden;
        width: 100%;
        max-width: 320px;
      }

      .cta-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 120%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.65),
          transparent
        );
        opacity: 0.8;
        transition: left 0.55s ease-out;
      }

      .cta-button:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.95),
          0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      .cta-button:hover::before {
        left: 110%;
      }

      .cta-label {
        position: relative;
        z-index: 1;
      }

      .cta-button svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        transition: transform 0.3s;
        position: relative;
        z-index: 1;
      }

      .cta-button:hover svg {
        transform: translateX(4px);
      }

      @media (max-width: 768px) {
        .circle-1,
        .circle-2 {
          opacity: 0.3;
          filter: blur(4px);
        }
      }

      @media (max-width: 480px) {
        .triangle-1,
        .triangle-2,
        .rectangle-1,
        .rectangle-2,
        .line-1,
        .line-2,
        .square-1,
        .arc-1 {
          opacity: 0.2;
        }
      }

      ::selection {
        color: #000;
        background-color: var(--bauhaus-yellow);
      }
    </style>
    <link
      rel="stylesheet"
      href="https://fonts.bunny.net/css?family=hanken-grotesk:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i&display=swap"
    />
    <link
      rel="icon"
      type="image/png"
      href="https://maida-vale.pages.dev/assets/external/portfolio/favicon.png"
    />
  </head>
  <body>
    <div class="bg-container">
      <div class="bg-layer"></div>
      <div class="bg-shape circle-1"></div>
      <div class="bg-shape circle-2"></div>
      <div class="bg-shape triangle-1"></div>
      <div class="bg-shape triangle-2"></div>
      <div class="bg-shape rectangle-1"></div>
      <div class="bg-shape rectangle-2"></div>
      <div class="bg-shape line-1"></div>
      <div class="bg-shape line-2"></div>
      <div class="bg-shape square-1"></div>
      <div class="bg-shape arc-1"></div>
    </div>

    <div class="card-wrapper">
      <div class="card">
        <div class="card-decoration card-circle"></div>
        <div class="card-decoration card-triangle"></div>
        <div class="card-decoration card-stripe"></div>

        <div class="profile-section">
          <div class="avatar">AB</div>
          <h1>Alex Boncza</h1>
          <p class="subtitle">Software Builder</p>
          <p class="description">
            Creating systems <span>designed for longevity</span>. Full-stack,
            product-minded, and dedicated to the boring parts that keep things
            for years.
          </p>
        </div>

        <p
          style="
            max-width: 256px;
            margin-top: -10px;
            margin-bottom: 25px;
            margin-right: auto;
            margin-left: auto;
            font-size: 0.85rem;
            color: #bbb;
            line-height: 1.5;
          "
        >
          Access my portfolio, contact details, and professional links below.
        </p>

        <div class="cta-row">
          <a
            href="https://boncza.short.gy/links"
            class="cta-button"
            target="_blank"
          >
            <span class="cta-label">All My Links</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13.5 4.5L21 12m0 0-7.5 7.5M21 12H3"
              />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
